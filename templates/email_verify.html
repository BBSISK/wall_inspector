<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification — Global Wall Inspector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .verify-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon-box {
      width: 56px;
      height: 56px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid #38bdf8;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #38bdf8;
      margin: 0 auto 1.25rem;
    }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.45rem;
      color: #f8fafc;
    }
    p.verify-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    .email-highlight {
      color: #38bdf8;
      font-weight: 700;
    }
    .demo-callout {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #a7f3d0;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pin-input {
      width: 100%;
      background: #090e1a;
      border: 2px solid #334155;
      color: #38bdf8;
      font-family: monospace;
      font-size: 2rem;
      letter-spacing: 10px;
      text-align: center;
      padding: 0.75rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .pin-input:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: #0284c7; }
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .footer-link {
      display: block;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.82rem;
    }
    .footer-link:hover { color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="verify-card">
    <div class="icon-box">
      <i class="fa-solid fa-envelope-circle-check"></i>
    </div>

    <h2>Enter Verification Code</h2>
    <p class="verify-desc">
      A single-use 6-digit access code was generated for <span class="email-highlight">{{ email }}</span>.
    </p>

    {% if error %}
      <div class="error-alert">{{ error }}</div>
    {% endif %}

    {% if otp_demo_display %}
      <div class="demo-callout">
        <i class="fa-solid fa-key"></i>
        <span>Demo / Local Sandbox Passcode: <strong style="font-family: monospace; font-size: 1.05rem; letter-spacing: 2px;">{{ otp_demo_display }}</strong></span>
      </div>
    {% endif %}

    <form method="POST" action="/auth/email/verify">
      <input type="hidden" name="email" value="{{ email }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <input type="text" name="otp_code" class="pin-input" maxlength="6" placeholder="••••••" pattern="[0-9]*" inputmode="numeric" autofocus required value="{{ otp_demo_display or '' }}">
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-check"></i> Verify &amp; Access Workstation
      </button>
    </form>

    <a href="/admin/login" class="footer-link">&larr; Return to Sign-In Options</a>
  </div>

</body>
</html>
