<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspect: {{ wall.title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.5rem; background: #0f172a; color: #f8fafc; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; height: calc(100vh - 5.5rem); }
    .viewport-outer { position: relative; background: #0b1329; border-radius: 8px; overflow: hidden; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
    #wall-img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
    #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
    .sidebar { background: #1e293b; border-radius: 8px; padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; border: 1px solid #334155; }
    input, select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 0.6rem; font-size: 0.85rem; }
    label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .btn { background: #059669; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn:hover { background: #047857; }
    .btn-toggle { background: #334155; color: #93c5fd; padding: 0.4rem 0.6rem; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-toggle.active { background: #2563eb; color: white; }
    .card-feedback { background: #0f172a; border-radius: 6px; padding: 0.75rem; border-left: 4px solid #64748b; cursor: pointer; }
    .card-correct { border-left-color: #10b981; }
    .card-partial { border-left-color: #f59e0b; }
    .card-misclassified { border-left-color: #eab308; }
    .card-missed { border-left-color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2 style="margin: 0;">{{ wall.title }}</h2>
      <small style="color: #94a3b8;">{{ wall.wall_type }} • {{ wall.difficulty }}</small>
    </div>
    <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 0.9rem;">&larr; Exit to Catalog</a>
  </div>

  <div class="layout">
    <div class="viewport-outer" id="viewport-outer">
      <img id="wall-img" src="{{ wall.image_url }}" alt="Inspection Subject" crossorigin="anonymous">
      <svg id="canvas-overlay"></svg>
    </div>

    <div class="sidebar" id="sidebar">
      <div id="setup-panel">
        <label>Inspector Candidate Name</label>
        <input type="text" id="student-name" placeholder="Enter your full name" value="Inspector Candidate">
        <hr style="border-color: #334155; margin: 0.5rem 0;">
      </div>

      <div id="tagging-panel">
        <h3 style="margin: 0;">Diagnostic Marker</h3>
        <p style="font-size: 0.8rem; color: #94a3b8; margin: 0;">Click & drag on the wall to outline a suspected structural defect.</p>
        
        <label>Suspected Defect Category</label>
        <select id="marker-category">
          {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.label }}</option>
          {% endfor %}
        </select>
        
        <button type="button" class="btn" id="add-marker-btn" style="background: #2563eb;">Pin Marker</button>
        <hr style="border-color: #334155; margin: 0.5rem 0;">
        
        <h4 style="margin: 0;">Identified Zones (<span id="marker-count">0</span>)</h4>
        <div id="marker-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>

        <button type="button" class="btn" id="submit-inspection-btn" style="margin-top: 1rem;">Submit Final Assessment</button>
      </div>

      <div id="results-panel" style="display: none; flex-direction: column; gap: 1rem;">
        <h3 style="margin: 0;" id="score-header">Evaluation Debrief</h3>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn-toggle active" id="toggle-student">Your Markers (Blue)</button>
          <button class="btn-toggle active" id="toggle-truth">Ground Truth (Red)</button>
        </div>
        <div id="feedback-container" style="display: flex; flex-direction: column; gap: 0.6rem;"></div>
        <div id="cert-link-box" style="display: none;">
          <a id="cert-btn" href="#" target="_blank" class="btn" style="background: #059669; text-align: center; text-decoration: none; display: block;">Claim Official Certificate &rarr;</a>
        </div>
        <a href="/" class="btn" style="background: #334155; text-align: center; text-decoration: none;">Return to Catalog</a>
      </div>
    </div>
  </div>

  <script>
    const SLUG = "{{ wall.slug }}";
    const img = document.getElementById("wall-img");
    const svg = document.getElementById("canvas-overlay");
    const outer = document.getElementById("viewport-outer");
    let isDrawing = false, startX = 0, startY = 0, currentRect = null;
    let pendingBox = null;
    let markers = [];
    let submittedData = null;
    let showStudent = true;
    let showTruth = true;

    function syncOverlay() {
      const rect = img.getBoundingClientRect();
      const outerRect = outer.getBoundingClientRect();
      svg.style.width = `${rect.width}px`;
      svg.style.height = `${rect.height}px`;
      svg.style.left = `${rect.left - outerRect.left}px`;
      svg.style.top = `${rect.top - outerRect.top}px`;
      renderMarkers();
    }

    if (img.complete) syncOverlay();
    else img.addEventListener("load", syncOverlay);
    window.addEventListener("resize", syncOverlay);

    svg.addEventListener("mousedown", (e) => {
      if (submittedData) return;
      const bounds = svg.getBoundingClientRect();
      isDrawing = true;
      startX = e.clientX - bounds.left;
      startY = e.clientY - bounds.top;

      if (currentRect) currentRect.remove();
      currentRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      currentRect.setAttribute("stroke", "#38bdf8");
      currentRect.setAttribute("stroke-width", "2");
      currentRect.setAttribute("stroke-dasharray", "4");
      currentRect.setAttribute("fill", "rgba(56, 189, 248, 0.2)");
      svg.appendChild(currentRect);
    });

    svg.addEventListener("mousemove", (e) => {
      if (!isDrawing) return;
      const bounds = svg.getBoundingClientRect();
      const curX = Math.max(0, Math.min(e.clientX - bounds.left, bounds.width));
      const curY = Math.max(0, Math.min(e.clientY - bounds.top, bounds.height));

      currentRect.setAttribute("x", Math.min(startX, curX));
      currentRect.setAttribute("y", Math.min(startY, curY));
      currentRect.setAttribute("width", Math.abs(curX - startX));
      currentRect.setAttribute("height", Math.abs(curY - startY));
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const bounds = svg.getBoundingClientRect();
      const curX = Math.max(0, Math.min(e.clientX - bounds.left, bounds.width));
      const curY = Math.max(0, Math.min(e.clientY - bounds.top, bounds.height));

      const w = Math.abs(curX - startX);
      const h = Math.abs(curY - startY);

      if (w > 15 && h > 15) {
        pendingBox = {
          x_min: Math.min(startX, curX) / bounds.width,
          y_min: Math.min(startY, curY) / bounds.height,
          x_max: Math.max(startX, curX) / bounds.width,
          y_max: Math.max(startY, curY) / bounds.height
        };
      } else if (currentRect) {
        currentRect.remove();
        currentRect = null;
      }
    });

    document.getElementById("add-marker-btn").addEventListener("click", () => {
      if (!pendingBox) {
        alert("Please drag a box over a suspected defect first.");
        return;
      }
      const catSelect = document.getElementById("marker-category");
      markers.push({
        ...pendingBox,
        category: catSelect.value,
        categoryLabel: catSelect.options[catSelect.selectedIndex].text
      });
      pendingBox = null;
      if (currentRect) { currentRect.remove(); currentRect = null; }
      renderMarkers();
    });

    function renderMarkers() {
      const bounds = svg.getBoundingClientRect();
      svg.innerHTML = "";

      if (!submittedData) {
        markers.forEach((m, idx) => {
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", m.x_min * bounds.width);
          rect.setAttribute("y", m.y_min * bounds.height);
          rect.setAttribute("width", (m.x_max - m.x_min) * bounds.width);
          rect.setAttribute("height", (m.y_max - m.y_min) * bounds.height);
          rect.setAttribute("stroke", "#38bdf8");
          rect.setAttribute("stroke-width", "2");
          rect.setAttribute("fill", "rgba(56, 189, 248, 0.2)");
          svg.appendChild(rect);
        });
        document.getElementById("marker-count").innerText = markers.length;
        document.getElementById("marker-list").innerHTML = markers.map((m, i) => `
          <div style="background: #0f172a; padding: 0.5rem; border-radius: 4px; display: flex; justify-content: space-between; font-size: 0.8rem;">
            <span>${m.categoryLabel}</span>
            <button onclick="removeMarker(${i})" style="background: none; border: none; color: #f87171; cursor: pointer;">&times;</button>
          </div>
        `).join("");
      } else {
        // Render Review Mode
        if (showTruth && submittedData.ground_truth) {
          submittedData.ground_truth.forEach(gt => {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", gt.x_min * bounds.width);
            rect.setAttribute("y", gt.y_min * bounds.height);
            rect.setAttribute("width", (gt.x_max - gt.x_min) * bounds.width);
            rect.setAttribute("height", (gt.y_max - gt.y_min) * bounds.height);
            rect.setAttribute("stroke", "#ef4444");
            rect.setAttribute("stroke-width", "2");
            rect.setAttribute("stroke-dasharray", "4");
            rect.setAttribute("fill", "rgba(239, 68, 68, 0.2)");
            svg.appendChild(rect);
          });
        }
        if (showStudent && submittedData.submitted_markers) {
          submittedData.submitted_markers.forEach(m => {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", m.x_min * bounds.width);
            rect.setAttribute("y", m.y_min * bounds.height);
            rect.setAttribute("width", (m.x_max - m.x_min) * bounds.width);
            rect.setAttribute("height", (m.y_max - m.y_min) * bounds.height);
            rect.setAttribute("stroke", "#38bdf8");
            rect.setAttribute("stroke-width", "2");
            rect.setAttribute("fill", "rgba(56, 189, 248, 0.25)");
            svg.appendChild(rect);
          });
        }
      }
    }

    window.removeMarker = function(idx) {
      markers.splice(idx, 1);
      renderMarkers();
    };

    document.getElementById("submit-inspection-btn").addEventListener("click", async () => {
      const studentName = document.getElementById("student-name").value.trim() || "Inspector Candidate";
      const res = await fetch(`/inspect/${SLUG}/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          student_name: studentName,
          markers: markers
        })
      });
      submittedData = await res.json();

      document.getElementById("tagging-panel").style.display = "none";
      document.getElementById("setup-panel").style.display = "none";
      const resultsPanel = document.getElementById("results-panel");
      resultsPanel.style.display = "flex";

      document.getElementById("score-header").innerHTML = `Score: <span style="color: ${submittedData.passed ? '#34d399' : '#f87171'}">${submittedData.score}%</span> (${submittedData.passed ? 'PASSED' : 'REVISE'})`;

      const fbContainer = document.getElementById("feedback-container");
      fbContainer.innerHTML = submittedData.feedback.map(f => `
        <div class="card-feedback card-${f.status}">
          <strong style="display: block; text-transform: uppercase; font-size: 0.75rem; color: #94a3b8;">${f.status}</strong>
          <strong>${f.title}</strong>
          <p style="margin: 4px 0 0; font-size: 0.8rem; color: #cbd5e1;">${f.explanation}</p>
        </div>
      `).join("");

      if (submittedData.qualifies_for_cert && submittedData.certificate_code) {
        const certBox = document.getElementById("cert-link-box");
        certBox.style.display = "block";
        document.getElementById("cert-btn").href = `/certificate/${submittedData.certificate_code}`;
      }

      renderMarkers();
    });

    document.getElementById("toggle-student").addEventListener("click", function() {
      showStudent = !showStudent;
      this.classList.toggle("active", showStudent);
      renderMarkers();
    });

    document.getElementById("toggle-truth").addEventListener("click", function() {
      showTruth = !showTruth;
      this.classList.toggle("active", showTruth);
      renderMarkers();
    });
  </script>
</body>
</html>
