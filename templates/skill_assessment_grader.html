<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Truth Defect Grader - {{ wall.title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090e1a;
      --panel-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --emerald: #059669;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-nav {
      background: var(--panel-dark);
      border-bottom: 1px solid var(--border-dark);
      padding: 0.6rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 100;
    }
    .specimen-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .specimen-info h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      max-width: 500px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-top {
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .btn-exit { background: #1e293b; color: #94a3b8; border-color: #334155; }
    .btn-exit:hover { color: #f8fafc; border-color: #64748b; }
    .btn-save-all {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .btn-save-all:hover { filter: brightness(1.15); box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }

    /* Workstation Layout */
    .workstation-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Main Canvas Viewport */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }
    .canvas-wrap {
      position: relative;
      display: inline-block;
      user-select: none;
    }
    .canvas-img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      display: block;
      box-shadow: 0 4px 30px rgba(0,0,0,0.8);
    }

    .hud-hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(2, 132, 199, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 50;
    }

    /* Ground Truth Marker Pin & Tolerance Circle */
    .gt-item-group {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
    }
    .gt-circle {
      position: absolute;
      border: 2px dashed #00f2fe;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.12);
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
    }
    .gt-center-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #00f2fe;
      border: 2px solid white;
      box-shadow: 0 0 10px #00f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #0f172a;
      z-index: 20;
    }
    .gt-badge-title {
      position: absolute;
      top: 26px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Right Sidebar */
    .sidebar {
      width: 420px;
      background: var(--panel-dark);
      border-left: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      z-index: 90;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .defect-count-badge {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .gt-card-item {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .gt-card-item.active { border-color: #00f2fe; }
    .gt-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-del-gt {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-del-gt:hover { color: #ef4444; }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--border-dark);
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Modal for pin configuration */
    #grade-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-card {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .modal-title {
      margin: 0 0 1rem 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 0.85rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .form-control {
      width: 100%;
      background: #090e1a;
      border: 1px solid var(--border-dark);
      color: var(--text-main);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }
    .form-control:focus { border-color: #38bdf8; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #00f2fe;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .btn-cancel {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid var(--border-dark);
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save-gt {
      background: #0284c7;
      color: white;
      border: 1px solid #38bdf8;
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-nav">
    <div class="specimen-info">
      <a href="/skill-assessment/admin" class="btn-top btn-exit"><i class="fa-solid fa-arrow-left"></i> Queue</a>
      <h1 title="{{ wall.title }}"><i class="fa-solid fa-pen-ruler" style="color: #00f2fe;"></i> {{ wall.title }}</h1>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="/skill-assessment/{{ wall.slug }}" target="_blank" class="btn-top btn-exit" title="Open student view">
        <i class="fa-solid fa-eye"></i> Test Student View
      </a>
      <button type="button" class="btn-top btn-save-all" onclick="saveAllDefects()">
        <i class="fa-solid fa-floppy-disk"></i> Save Ground Truth
      </button>
    </div>
  </header>

  <!-- Grader Body -->
  <div class="workstation-body">

    <!-- Viewport Container -->
    <div class="viewport-container" id="viewport">
      <div class="hud-hint">
        <i class="fa-solid fa-bullseye"></i> Click anywhere on the wall face to place or move a ground-truth defect
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <img src="{{ wall.image_url }}" alt="{{ wall.title }}" class="canvas-img" id="target-image" onclick="handleImageClick(event)">
        <!-- Layer for Ground Truth Pins and Tolerance Circles -->
        <div id="gt-layer" style="position: absolute; inset: 0; pointer-events: none;"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2><i class="fa-solid fa-flag" style="color: #00f2fe;"></i> Ground Truth Targets</h2>
        <span class="defect-count-badge" id="gt-count-badge">0 Targets</span>
      </div>

      <div class="sidebar-content" id="gt-list"></div>

      <div class="sidebar-footer">
        <button type="button" class="btn-top btn-save-all" style="justify-content: center; padding: 0.75rem;" onclick="saveAllDefects()">
          <i class="fa-solid fa-cloud-arrow-up"></i> Save & Publish Specimen Defects
        </button>
      </div>
    </aside>

  </div>

  <!-- Defect Configuration Modal -->
  <div id="grade-modal">
    <div class="modal-card">
      <h3 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> Configure Ground Truth Defect</h3>

      <div class="form-group">
        <label>Defect Descriptive Title</label>
        <input type="text" class="form-control" id="modal-title" placeholder="e.g. Bed Joint Lime Mortar Washout" required>
      </div>

      <div class="form-group">
        <label>Defect Mode (Standard Taxonomy)</label>
        <select class="form-control" id="modal-category">
          {% for mode in defect_modes %}
            <option value="{{ mode.id }}">{{ mode.label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Severity Rating</label>
        <select class="form-control" id="modal-severity">
          <option value="minor">Minor (Superficial / Weathering)</option>
          <option value="moderate" selected>Moderate (Active joint recession)</option>
          <option value="critical">Critical (Structural instability)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Recommended Conservation Intervention</label>
        <select class="form-control" id="modal-remedial">
          {% for rem in remedial_options %}
            <option value="{{ rem.id }}">{{ rem.label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Tolerance Radius (Acceptable Student Hit Zone)</label>
        <div class="slider-row">
          <input type="range" id="modal-tol" min="0.04" max="0.15" step="0.01" value="0.08" oninput="updateTolerancePreview(this.value)">
          <span id="tol-val" style="font-weight: 800; color: #00f2fe; width: 45px;">8%</span>
        </div>
        <small style="color: var(--text-muted); font-size: 0.72rem;">Radius of acceptable student pin clicks from center.</small>
      </div>

      <div class="form-group">
        <label>Expert Diagnostic Rationale & Explanation</label>
        <textarea class="form-control" id="modal-explanation" rows="3" placeholder="Explain the pathological mechanism (e.g. frost-thaw action along bedding planes)..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeGradeModal()">Cancel</button>
        <button type="button" class="btn-save-gt" onclick="saveCurrentDefect()">Save Target</button>
      </div>
    </div>
  </div>

  <script>
    const wallSlug = {{ wall.slug|tojson }};
    const initialDefects = {{ defects|tojson }};
    const defectModesData = {{ defect_modes|tojson }};
    const modeLookup = {};
    defectModesData.forEach(m => { modeLookup[m.id] = m; });

    let defectList = [];
    let editingIndex = -1;
    let pendingCoords = null;

    // Load initial defects
    initialDefects.forEach(d => {
      const cx = (d.x_min + d.x_max) / 2.0;
      const cy = (d.y_min + d.y_max) / 2.0;
      defectList.push({
        x: cx,
        y: cy,
        tolerance_radius: d.tolerance_radius || 0.08,
        category: d.category,
        severity: d.severity || 'moderate',
        remedial_action: d.remedial_action || 'repoint_lime',
        title: d.title || 'Ground Truth Defect',
        explanation: d.explanation || ''
      });
    });

    renderAll();

    function updateTolerancePreview(val) {
      document.getElementById('tol-val').textContent = Math.round(val * 100) + '%';
    }

    function handleImageClick(e) {
      const img = document.getElementById('target-image');
      const rect = img.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;

      if (x < 0 || x > 1 || y < 0 || y > 1) return;

      editingIndex = -1;
      pendingCoords = { x: parseFloat(x.toFixed(4)), y: parseFloat(y.toFixed(4)) };

      document.getElementById('modal-title').value = '';
      document.getElementById('modal-explanation').value = '';
      document.getElementById('modal-tol').value = 0.08;
      updateTolerancePreview(0.08);

      document.getElementById('grade-modal').style.display = 'flex';
    }

    function editDefect(index) {
      editingIndex = index;
      const d = defectList[index];
      pendingCoords = { x: d.x, y: d.y };

      document.getElementById('modal-title').value = d.title;
      document.getElementById('modal-category').value = d.category;
      document.getElementById('modal-severity').value = d.severity;
      document.getElementById('modal-remedial').value = d.remedial_action;
      document.getElementById('modal-tol').value = d.tolerance_radius;
      document.getElementById('modal-explanation').value = d.explanation;
      updateTolerancePreview(d.tolerance_radius);

      document.getElementById('grade-modal').style.display = 'flex';
    }

    function closeGradeModal() {
      document.getElementById('grade-modal').style.display = 'none';
      pendingCoords = null;
      editingIndex = -1;
    }

    function saveCurrentDefect() {
      if (!pendingCoords) return;
      const title = document.getElementById('modal-title').value.trim() || 'Ground Truth Defect';
      const category = document.getElementById('modal-category').value;
      const severity = document.getElementById('modal-severity').value;
      const remedial = document.getElementById('modal-remedial').value;
      const tol = parseFloat(document.getElementById('modal-tol').value);
      const explanation = document.getElementById('modal-explanation').value.trim();

      const item = {
        x: pendingCoords.x,
        y: pendingCoords.y,
        tolerance_radius: tol,
        category: category,
        severity: severity,
        remedial_action: remedial,
        title: title,
        explanation: explanation
      };

      if (editingIndex >= 0) {
        defectList[editingIndex] = item;
      } else {
        defectList.push(item);
      }

      closeGradeModal();
      renderAll();
    }

    function deleteDefect(index) {
      defectList.splice(index, 1);
      renderAll();
    }

    function renderAll() {
      // 1. Render on Canvas
      const layer = document.getElementById('gt-layer');
      layer.innerHTML = '';

      defectList.forEach((d, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'gt-item-group';
        wrap.style.left = (d.x * 100) + '%';
        wrap.style.top = (d.y * 100) + '%';
        wrap.onclick = function(e) {
          e.stopPropagation();
          editDefect(idx);
        };

        const diameterPct = (d.tolerance_radius * 2) * 100;
        wrap.innerHTML = `
          <div class="gt-circle" style="width: ${diameterPct}vw; height: ${diameterPct}vw; max-width: ${diameterPct*8}px; max-height: ${diameterPct*8}px;"></div>
          <div class="gt-center-pin" title="Click to edit">${idx + 1}</div>
          <div class="gt-badge-title">${d.title}</div>
        `;
        layer.appendChild(wrap);
      });

      // 2. Render on Sidebar
      const sidebarList = document.getElementById('gt-list');
      const badge = document.getElementById('gt-count-badge');
      badge.textContent = `${defectList.length} Targets`;

      sidebarList.innerHTML = '';
      if (defectList.length === 0) {
        sidebarList.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 2rem 1rem;">
            <i class="fa-solid fa-bullseye" style="font-size: 2rem; color: #334155; margin-bottom: 0.5rem;"></i>
            <div>No ground truth defects marked.</div>
            <small>Click on the wall to set targets.</small>
          </div>
        `;
      } else {
        defectList.forEach((d, idx) => {
          const mode = modeLookup[d.category] || { label: d.category };
          const card = document.createElement('div');
          card.className = 'gt-card-item';
          card.innerHTML = `
            <div class="gt-card-header">
              <strong style="color: #00f2fe; font-size: 0.85rem;">#${idx + 1} • ${d.title}</strong>
              <button type="button" class="btn-del-gt" onclick="deleteDefect(${idx})" title="Delete target">&times;</button>
            </div>
            <div style="font-size: 0.78rem; color: #cbd5e1;">${mode.label}</div>
            <div style="font-size: 0.72rem; color: var(--text-muted); display: flex; gap: 8px;">
              <span>Pos: (${Math.round(d.x*100)}%, ${Math.round(d.y*100)}%)</span>
              <span>Tol: &plusmn;${Math.round(d.tolerance_radius*100)}%</span>
              <span>Sev: ${d.severity}</span>
            </div>
            <div style="margin-top: 4px;">
              <button type="button" class="btn-top btn-exit" style="padding: 2px 8px; font-size: 0.72rem;" onclick="editDefect(${idx})">
                <i class="fa-solid fa-pen"></i> Edit Settings
              </button>
            </div>
          `;
          sidebarList.appendChild(card);
        });
      }
    }

    async function saveAllDefects() {
      try {
        const response = await fetch(`/api/skill-assessment/grade/${wallSlug}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ defects: defectList })
        });
        const res = await response.json();
        if (res.success) {
          alert('Ground truth defects saved successfully (' + res.count + ' targets)!');
        } else {
          alert('Error saving defects: ' + (res.error || 'Unknown error'));
        }
      } catch (err) {
        console.error(err);
        alert('Save failed.');
      }
    }
  </script>

</body>
</html>
