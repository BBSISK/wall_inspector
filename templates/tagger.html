<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Tagger: {{ wall.title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.5rem; background: #0f172a; color: #f8fafc; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .header h2 { margin: 0; font-size: 1.4rem; }
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; height: calc(100vh - 5.5rem); }
    .viewport-outer { position: relative; background: #0b1329; border-radius: 8px; overflow: hidden; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
    #wall-img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
    #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
    .sidebar { background: #1e293b; border-radius: 8px; padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; border: 1px solid #334155; }
    input, select, textarea { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 0.6rem; font-size: 0.85rem; }
    label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-top: 0.25rem; display: block; }
    .btn { background: #2563eb; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn:hover { background: #1d4ed8; }
    .defect-card { background: #0f172a; border-left: 4px solid #ef4444; border-radius: 4px; padding: 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2>{{ wall.title }}</h2>
      <small style="color: #94a3b8;">{{ wall.wall_type }} • {{ wall.country }}</small>
    </div>
    <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 0.9rem;">&larr; Return to Dashboard</a>
  </div>

  <div class="layout">
    <div class="viewport-outer" id="viewport-outer">
      <img id="wall-img" src="{{ wall.image_url }}" alt="Wall for Tagging" crossorigin="anonymous">
      <svg id="canvas-overlay"></svg>
    </div>

    <div class="sidebar">
      <h3 style="margin: 0;">Add Ground Truth</h3>
      <p style="font-size: 0.8rem; color: #94a3b8; margin: 0;">Click & drag on the wall image to box a defect.</p>

      <label>Defect Title</label>
      <input type="text" id="defect-title" placeholder="e.g. Center Gap & Washout">

      <label>Category</label>
      <select id="defect-category">
        {% for cat in categories %}
          <option value="{{ cat.id }}">{{ cat.label }}</option>
        {% endfor %}
      </select>

      <label>Severity</label>
      <select id="defect-severity">
        <option value="minor">Minor</option>
        <option value="moderate" selected>Moderate</option>
        <option value="critical">Critical</option>
      </select>

      <label>Remedial Action Prescription</label>
      <select id="defect-remedial">
        {% for rem in remedial_options %}
          <option value="{{ rem.id }}">{{ rem.label }}</option>
        {% endfor %}
      </select>

      <label>Educational Explanation</label>
      <textarea id="defect-explanation" rows="3" placeholder="Why this failure occurred and remediation needed..."></textarea>

      <button type="button" class="btn" id="save-defect-btn">Save Ground Truth Zone</button>

      <hr style="border-color: #334155; width: 100%; margin: 0.5rem 0;">
      <h4 style="margin: 0;">Logged Defects (<span id="defect-count">0</span>)</h4>
      <div id="defects-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
    </div>
  </div>

  <script>
    const WALL_ID = "{{ wall.id }}";
    const img = document.getElementById("wall-img");
    const svg = document.getElementById("canvas-overlay");
    const outer = document.getElementById("viewport-outer");
    let isDrawing = false, startX = 0, startY = 0, currentRect = null;
    let pendingBox = null;
    let defects = [];

    function syncOverlay() {
      const rect = img.getBoundingClientRect();
      const outerRect = outer.getBoundingClientRect();
      svg.style.width = `${rect.width}px`;
      svg.style.height = `${rect.height}px`;
      svg.style.left = `${rect.left - outerRect.left}px`;
      svg.style.top = `${rect.top - outerRect.top}px`;
      renderDefects();
    }

    if (img.complete) {
      syncOverlay();
    } else {
      img.addEventListener("load", syncOverlay);
    }
    window.addEventListener("resize", syncOverlay);

    svg.addEventListener("mousedown", (e) => {
      const bounds = svg.getBoundingClientRect();
      isDrawing = true;
      startX = e.clientX - bounds.left;
      startY = e.clientY - bounds.top;

      if (currentRect) currentRect.remove();
      currentRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      currentRect.setAttribute("stroke", "#38bdf8");
      currentRect.setAttribute("stroke-width", "2");
      currentRect.setAttribute("stroke-dasharray", "4");
      currentRect.setAttribute("fill", "rgba(56, 189, 248, 0.2)");
      svg.appendChild(currentRect);
    });

    svg.addEventListener("mousemove", (e) => {
      if (!isDrawing) return;
      const bounds = svg.getBoundingClientRect();
      const curX = Math.max(0, Math.min(e.clientX - bounds.left, bounds.width));
      const curY = Math.max(0, Math.min(e.clientY - bounds.top, bounds.height));

      const x = Math.min(startX, curX);
      const y = Math.min(startY, curY);
      const w = Math.abs(curX - startX);
      const h = Math.abs(curY - startY);

      currentRect.setAttribute("x", x);
      currentRect.setAttribute("y", y);
      currentRect.setAttribute("width", w);
      currentRect.setAttribute("height", h);
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const bounds = svg.getBoundingClientRect();
      const curX = Math.max(0, Math.min(e.clientX - bounds.left, bounds.width));
      const curY = Math.max(0, Math.min(e.clientY - bounds.top, bounds.height));

      const x = Math.min(startX, curX);
      const y = Math.min(startY, curY);
      const w = Math.abs(curX - startX);
      const h = Math.abs(curY - startY);

      if (w > 15 && h > 15) {
        pendingBox = {
          x_min: x / bounds.width,
          y_min: y / bounds.height,
          x_max: (x + w) / bounds.width,
          y_max: (y + h) / bounds.height
        };
      } else if (currentRect) {
        currentRect.remove();
        currentRect = null;
      }
    });

    async function loadDefects() {
      const res = await fetch(`/admin/walls/${WALL_ID}/defects`);
      defects = await res.json();
      renderDefects();
    }

    function renderDefects() {
      const bounds = svg.getBoundingClientRect();
      svg.innerHTML = "";
      if (currentRect && isDrawing) svg.appendChild(currentRect);

      defects.forEach((d) => {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", d.x_min * bounds.width);
        rect.setAttribute("y", d.y_min * bounds.height);
        rect.setAttribute("width", (d.x_max - d.x_min) * bounds.width);
        rect.setAttribute("height", (d.y_max - d.y_min) * bounds.height);
        rect.setAttribute("stroke", "#ef4444");
        rect.setAttribute("stroke-width", "2");
        rect.setAttribute("fill", "rgba(239, 68, 68, 0.2)");
        svg.appendChild(rect);
      });

      document.getElementById("defect-count").innerText = defects.length;
      document.getElementById("defects-list").innerHTML = defects.map(d => `
        <div class="defect-card">
          <div style="display: flex; justify-content: space-between;">
            <strong style="color: #ef4444;">${d.title}</strong>
            <button onclick="deleteDefect('${d.id}')" style="background: none; border: none; color: #f87171; cursor: pointer;">&times;</button>
          </div>
          <p style="margin: 4px 0 0; color: #94a3b8; font-size: 0.75rem;">${d.category} • ${d.severity} • Rx: ${d.remedial_action || 'repoint_lime'}</p>
        </div>
      `).join("");
    }

    window.deleteDefect = async function(id) {
      await fetch(`/admin/defects/${id}`, { method: "DELETE" });
      loadDefects();
    };

    document.getElementById("save-defect-btn").addEventListener("click", async () => {
      if (!pendingBox) {
        alert("Please draw a bounding box over the defect zone on the wall image first.");
        return;
      }

      const payload = {
        ...pendingBox,
        title: document.getElementById("defect-title").value || "Structural Defect",
        category: document.getElementById("defect-category").value,
        severity: document.getElementById("defect-severity").value,
        remedial_action: document.getElementById("defect-remedial").value,
        explanation: document.getElementById("defect-explanation").value
      };

      await fetch(`/admin/walls/${WALL_ID}/defects`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      pendingBox = null;
      if (currentRect) { currentRect.remove(); currentRect = null; }
      document.getElementById("defect-title").value = "";
      document.getElementById("defect-explanation").value = "";
      loadDefects();
    });

    loadDefects();
  </script>
</body>
</html>
