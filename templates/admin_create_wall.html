<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Wall - Global Wall Inspector</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 8px; border: 1px solid #334155; }
    h2 { margin-top: 0; }
    label { display: block; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin-top: 1rem; margin-bottom: 0.25rem; font-weight: 600; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; }
    .btn { display: inline-block; background: #059669; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 1.5rem; width: 100%; font-weight: 600; }
    .btn:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem;">&larr; Return to Catalog</a>
      <a href="/admin/logout" style="background: #7f1d1d; color: #fca5a5; padding: 0.35rem 0.65rem; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: 600;">🔒 Logout</a>
    </div>
    <h2>Add New Wall to Inspector Bank</h2>
    <form action="/admin/walls/new" method="POST" enctype="multipart/form-data">
      <label>Wall Image (JPEG / PNG)</label>
      <input type="file" name="wall_image" accept="image/*" required>

      <label>Wall Title</label>
      <input type="text" name="title" placeholder="e.g. Traditional Irish Stone Boundary Wall" required>

      <label>Description & Architectural Context</label>
      <textarea name="description" rows="3" placeholder="Identify age, structural function, and regional masonry technique..."></textarea>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <label>Wall Type / Archetype</label>
          <select name="wall_type">
            <option value="dry_stone">Dry Stone (Unmortared Fieldstone)</option>
            <option value="brick_cavity">Brick Cavity / Industrial Masonry</option>
            <option value="lime_mortar">Historic Lime Mortar / Rubble</option>
            <option value="ashlar">Dressed Ashlar Masonry</option>
            <option value="retaining_wall">Retaining Wall & Dykes</option>
            <option value="cob_earth">Cob & Rammed Earth</option>
            <option value="flint_knapped">Flint & Knapped Stone</option>
            <option value="terracotta_faience">Terracotta & Faience</option>
            <option value="concrete_block">Concrete Blockwork</option>
            <option value="boulder_fieldstone">Boulder Fieldstone</option>
            <option value="granite_quoin">Granite Quoins</option>
          </select>
        </div>
        <div>
          <label>Difficulty Tier</label>
          <select name="difficulty">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <label>Country</label>
          <input type="text" name="country" placeholder="e.g. Ireland" value="Ireland" required>
        </div>
        <div>
          <label>Region / County</label>
          <input type="text" name="region" placeholder="e.g. Connemara">
        </div>
      </div>

      <button type="submit" class="btn">Upload Wall & Open Tagger &rarr;</button>
    </form>
  </div>
</body>
</html>
