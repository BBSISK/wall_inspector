name: Global Wall Inspector — Automated CI/CD & Agent Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-and-agent-tests:
    name: Python 3.11 Unit Tests, AI Agents & MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Regression & Agent Test Suite
        run: |
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Verify Model Context Protocol (MCP) Server Tools
        run: |
          python mcp_server.py --self-test
